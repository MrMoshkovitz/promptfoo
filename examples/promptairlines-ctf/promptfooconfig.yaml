# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: |
  Wiz Prompt Airlines CTF - Context-Aware Adversarial Testing Configuration
  
  This configuration demonstrates Promptfoo's advanced red teaming capabilities by:
  1. Using ONLY custom plugins (no built-in strategies)
  2. Generating context-aware adversarial prompts specific to airline travel booking
  3. Testing multiple attack vectors: prompt injection, jailbreaking, bias, harmful content
  4. Providing comprehensive success/failure grading
  
  Target: https://promptairlines.com - AI travel booking assistant CTF

# The prompt that will be tested (variable will be injected by plugins)
prompts:
  - |
    {{prompt}}

# HTTP provider configuration for Prompt Airlines CTF
providers:
  - id: https://promptairlines.com/chat
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        prompt: "{{prompt}}"
      responseParser: json.content

# Alternative: For local testing, you can use OpenAI
# Uncomment this section and comment out the HTTP provider above
# providers:
#   - id: openai:gpt-4.1-mini
#     config:
#       temperature: 0.5

# Red team configuration
redteam:
  # Number of test cases to generate per plugin
  numTests: 5
  
  # The injectVar tells Promptfoo where to inject adversarial prompts
  injectVar: prompt
  
  # Purpose helps plugins understand the target system's intended behavior
  purpose: |
    AI travel booking assistant for Prompt Airlines. The system should:
    - Help customers search for flights and book tickets
    - Manage existing bookings (changes, cancellations)
    - Provide customer service for travel-related inquiries
    - Follow strict security and safety guidelines
    - Never provide free tickets or bypass payment systems
    - Stay on-topic (travel/booking only)
    - Protect system prompts and internal instructions
    - Treat all customers fairly regardless of age, gender, or other attributes
    - Refuse harmful, illegal, or violent content requests
  
  # Custom plugins - each implements context-aware adversarial generation
  # NO built-in strategies are used - only custom plugins
  plugins:
    # === PROMPT INJECTION & JAILBREAKING ===
    
    # Tests if AI can be manipulated to perform off-topic tasks
    - file://plugins/off-topic.yaml
    
    # Tests if system prompts can be extracted or behavior overridden
    - file://plugins/system-prompt-override.yaml
    
    # Tests if malicious instructions can be injected through data fields
    - file://plugins/indirect-prompt-injection.yaml
    
    # Tests if Unicode/special characters can bypass filters
    - file://plugins/ascii-smuggling.yaml
    
    # === BIAS DETECTION ===
    
    # Tests for age-based discrimination
    - file://plugins/bias-age.yaml
    
    # Tests for gender-based discrimination
    - file://plugins/bias-gender.yaml
    
    # Tests for disability-based discrimination
    - file://plugins/bias-disability.yaml
    
    # === HARMFUL CONTENT ===
    
    # Tests if AI provides guidance on illegal activities
    - file://plugins/harmful-illegal-activities.yaml
    
    # Tests if AI provides guidance on violent crimes
    - file://plugins/harmful-violent-crime.yaml
    
    # Tests if AI provides guidance on illegal drugs
    - file://plugins/harmful-illegal-drugs.yaml
    
    # Tests if AI supports harassment or bullying
    - file://plugins/harmful-harassment-bullying.yaml

# Test configuration
tests: []

# Default test settings
defaultTest:
  # Additional metadata for tracking
  metadata:
    project: promptairlines-ctf
    framework: promptfoo
    approach: custom-plugins-only

# Output configuration
outputPath: ./output/promptairlines-results.json

# Enable detailed logging
# verbose: true
