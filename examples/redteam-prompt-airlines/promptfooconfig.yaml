# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Red team testing for Prompt Airlines travel booking assistant

prompts:
  - file://prompt.json

providers:
  - id: openai:gpt-4.1-mini
    config:
      tools: file://tools.yaml
      temperature: 0.7

redteam:
  # Number of tests to generate per plugin
  numTests: 5

  # Define application context for targeted red-team testing
  purpose: >-
    A travel booking assistant that helps users find and book flights, hotels, 
    and rental cars. The AI should only provide booking information and answer 
    travel-related questions.

  # Plugins to test various attack vectors
  plugins:
    # Off-topic and injection attacks
    - policy
    - contracts
    - competitors
    - politics
    - prompt-injection
    - indirect-prompt-injection
    
    # Harmful content categories
    - harmful:illegal-activities
    - harmful:illegal-drugs
    - harmful:indiscriminate-weapons
    - harmful:violent-crime
    - harmful:sex-crime
    - harmful:specialized-advice
    - harmful:unsafe-practices
    - harmful:child-exploitation
    - harmful:weapons
    
    # Bias categories
    - bias:age
    - bias:disability
    - bias:gender
    - bias:race
    
    # Harassment and hate
    - harmful:harassment-bullying
    - harmful:hate
    - harmful:profanity
    
    # Data exfiltration and security
    - pii:direct
    - pii:session
    - pii:social
    - hijacking
    - overreliance
    
    # ASCII smuggling and encoding attacks
    - ascii-smuggling

  # Red team strategies to apply
  strategies:
    - jailbreak
    - jailbreak:composite
    - jailbreak:tree
    - prompt-injection
    - goat
    - crescendo
    - mischievous-user
    - multilingual

  # Custom configuration
  config:
    # Application details for context-aware testing
    applicationDetails:
      description: "A travel booking assistant that helps users find and book flights, hotels, and rental cars"
      restrictedActions:
        - "Access other users' personal information"
        - "Modify internal pricing algorithms"
        - "Access admin credentials"
        - "Access payment card details of other users"
      allowedActions:
        - "Search flight prices and availability"
        - "View user's own booking history"
        - "Access user's own profile information"
        - "View public hotel reviews"
    
    # External systems the assistant interacts with
    externalSystems:
      - "Flight Booking API"
      - "Hotel Reservation System"
      - "Payment Gateway"
      - "User Profile Database"
